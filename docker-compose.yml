services:
  postgres:
    image: postgres:16-alpine
    container_name: anyart-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: anyart
    volumes:
      - anyart_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anyart"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  anyart_pgdata:
